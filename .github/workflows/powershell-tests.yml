name: Test PowerShell

on:
  push:
    branches:
      - 'master'
      - 'main'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'Docs/**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:  # 👈 enables manual triggering

permissions:
    contents: read

env:
    DOTNET_VERSION: '8.x'
    BUILD_CONFIGURATION: 'Debug'
    DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'

jobs:
    refresh-psd1:
        name: 'Refresh PSD1'
        runs-on: windows-latest
        timeout-minutes: 20
        permissions:
            contents: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}

            - name: Setup PowerShell modules
              run: |
                Install-Module PSPublishModule -Force -Scope CurrentUser -AllowClobber
              shell: pwsh


            - name: Refresh module manifest
              env:
                RefreshPSD1Only: 'true'
              run: |
                .\Module\Build\Build-Module.ps1
              shell: pwsh

            - name: Commit refreshed PSD1
              if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HEAD_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  $branch = $Env:HEAD_BRANCH
                  $pushRoot = Join-Path $Env:RUNNER_TEMP "domain-detective-psd1-refresh-push"
                  $repositoryUrl = "https://github.com/$Env:GITHUB_REPOSITORY.git"
                  $auth = [Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("x-access-token:$Env:GITHUB_TOKEN"))

                  for ($attempt = 1; $attempt -le 3; $attempt++) {
                    if (Test-Path -LiteralPath $pushRoot) {
                      Remove-Item -LiteralPath $pushRoot -Recurse -Force
                    }

                    Write-Host "Refreshing PSD1 from latest origin/$branch in a temporary clone (attempt $attempt of 3)."
                    git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" clone --no-tags --depth 1 --branch $branch $repositoryUrl $pushRoot
                    if ($LASTEXITCODE -ne 0) {
                      throw "Failed to clone origin/$branch."
                    }

                    Push-Location $pushRoot
                    try {
                      git config user.name "github-actions[bot]"
                      git config user.email "github-actions[bot]@users.noreply.github.com"

                      $Env:RefreshPSD1Only = 'true'
                      .\Module\Build\Build-Module.ps1

                      git add Module/DomainDetective.psd1
                      git diff --cached --quiet -- Module/DomainDetective.psd1
                      if ($LASTEXITCODE -eq 0) {
                        Write-Host "DomainDetective.psd1 is already current."
                        exit 0
                      }

                      git commit -m "chore: regenerate psd1"
                      if ($LASTEXITCODE -ne 0) {
                        throw "Failed to commit regenerated DomainDetective.psd1."
                      }

                      git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:$branch
                      if ($LASTEXITCODE -eq 0) {
                        exit 0
                      }
                    } finally {
                      Pop-Location
                    }

                    Write-Warning "Push to $branch failed, likely because the branch moved. Retrying from the latest branch tip."
                    Start-Sleep -Seconds ([Math]::Min(30, 5 * $attempt))
                  }

                  throw "Failed to push regenerated DomainDetective.psd1 after 3 attempts."


            - name: Upload refreshed manifest
              uses: actions/upload-artifact@v7
              with:
                name: psd1
                path: Module/DomainDetective.psd1

    test-windows-ps5:
        needs: refresh-psd1
        name: 'Windows PowerShell 5.1'
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Download manifest
              uses: actions/download-artifact@v8
              with:
                name: psd1
                path: Module

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Install PowerShell modules
              run: |
                Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
                Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
                Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
              shell: powershell


            - name: Build .NET solution
              shell: pwsh
              run: |
                dotnet restore DomainDetective.sln

                $args = @(
                  "build",
                  "DomainDetective.sln",
                  "--configuration", "${{ env.BUILD_CONFIGURATION }}",    
                  "--no-restore",
                  "-m:1",
                  "-p:UseSharedCompilation=false"
                )

                dotnet @args 2>&1 | Tee-Object -Variable buildOutput
                $exitCode = $LASTEXITCODE

                if ($exitCode -ne 0) {
                  $text = $buildOutput -join "`n"
                  $isTransientCliLock = ($text -match "GenerateRuntimeConfigurationFiles" -or $text -match "CS2012") -and
                                        $text -match "DomainDetective\\.CLI" -and
                                        $text -match "being used by another process"

                  if ($isTransientCliLock) {
                    Write-Host "Detected transient DomainDetective.CLI file lock. Retrying..."

                    Get-Process -Name VBCSCompiler -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
                    Remove-Item -Recurse -Force (Join-Path "DomainDetective.CLI" "obj") -ErrorAction SilentlyContinue
                    Remove-Item -Recurse -Force (Join-Path "DomainDetective.CLI" "bin") -ErrorAction SilentlyContinue

                    Start-Sleep -Seconds 2
                    dotnet build DomainDetective.sln --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore -m:1 -p:UseSharedCompilation=false
                    exit $LASTEXITCODE
                  }

                  exit $exitCode
                }

            - name: Run PowerShell tests
              run: ./Module/DomainDetective.Tests.ps1
              shell: powershell


    test-windows-ps7:
        needs: refresh-psd1
        name: 'Windows PowerShell 7'
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Download manifest
              uses: actions/download-artifact@v8
              with:
                name: psd1
                path: Module

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Install PowerShell modules
              run: |
                Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
                Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
                Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
                Install-Module -Name PSPublishModule -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
              shell: pwsh


            - name: Build .NET solution
              shell: pwsh
              run: |
                dotnet restore DomainDetective.sln

                $args = @(
                  "build",
                  "DomainDetective.sln",
                  "--configuration", "${{ env.BUILD_CONFIGURATION }}",    
                  "--no-restore",
                  "-m:1",
                  "-p:UseSharedCompilation=false"
                )

                dotnet @args 2>&1 | Tee-Object -Variable buildOutput
                $exitCode = $LASTEXITCODE

                if ($exitCode -ne 0) {
                  $text = $buildOutput -join "`n"
                  $isTransientCliLock = ($text -match "GenerateRuntimeConfigurationFiles" -or $text -match "CS2012") -and
                                        $text -match "DomainDetective\\.CLI" -and
                                        $text -match "being used by another process"

                  if ($isTransientCliLock) {
                    Write-Host "Detected transient DomainDetective.CLI file lock. Retrying..."

                    Get-Process -Name VBCSCompiler -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
                    Remove-Item -Recurse -Force (Join-Path "DomainDetective.CLI" "obj") -ErrorAction SilentlyContinue
                    Remove-Item -Recurse -Force (Join-Path "DomainDetective.CLI" "bin") -ErrorAction SilentlyContinue

                    Start-Sleep -Seconds 2
                    dotnet build DomainDetective.sln --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore -m:1 -p:UseSharedCompilation=false
                    exit $LASTEXITCODE
                  }

                  exit $exitCode
                }

            - name: Build packaged module for ALC tests
              env:
                RefreshPSD1Only: 'false'
              run: .\Module\Build\Build-Module.ps1
              shell: pwsh

            - name: Run PowerShell tests
              run: ./Module/DomainDetective.Tests.ps1
              shell: pwsh
    test-ubuntu:
        needs: refresh-psd1
        name: 'Ubuntu PowerShell 7'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Download manifest
              uses: actions/download-artifact@v8
              with:
                name: psd1
                path: Module

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Install PowerShell
              run: |
                curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
                curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/microsoft.list
                sudo apt-get update
                sudo apt-get install -y powershell

            - name: Install PowerShell modules
              run: |
                Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
                Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
                Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
              shell: pwsh


            - name: Build .NET solution
              shell: pwsh
              run: |
                dotnet restore DomainDetective.sln

                $args = @(
                  "build",
                  "DomainDetective.sln",
                  "--configuration", "${{ env.BUILD_CONFIGURATION }}",    
                  "--no-restore"
                )

                dotnet @args 2>&1 | Tee-Object -Variable buildOutput
                $exitCode = $LASTEXITCODE

                if ($exitCode -ne 0) {
                  $text = $buildOutput -join "`n"
                  $isTransientCliLock = ($text -match "GenerateRuntimeConfigurationFiles" -or $text -match "CS2012") -and
                                        $text -match "DomainDetective\\.CLI" -and
                                        $text -match "being used by another process"

                  if ($isTransientCliLock) {
                    Write-Host "Detected transient DomainDetective.CLI file lock. Retrying with -m:1..."
                    Start-Sleep -Seconds 2
                    dotnet build DomainDetective.sln --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore -m:1
                    exit $LASTEXITCODE
                  }

                  exit $exitCode
                }
            - name: Run PowerShell tests
              run: ./Module/DomainDetective.Tests.ps1
              shell: pwsh


    test-macos:
        needs: refresh-psd1
        name: 'macOS PowerShell 7'
        runs-on: macos-latest
        timeout-minutes: 20
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Download manifest
              uses: actions/download-artifact@v8
              with:
                name: psd1
                path: Module

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Install PowerShell
              shell: bash
              run: |
                if command -v pwsh >/dev/null 2>&1; then
                  pwsh --version
                  exit 0
                fi

                brew update
                brew tap powershell/tap
                brew install --cask powershell/tap/powershell || brew install powershell/tap/powershell
                pwsh --version

            - name: Install PowerShell modules
              run: |
                Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
                Install-Module -Name Pester -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
                Install-Module -Name PSWriteColor -Repository PSGallery -Force -SkipPublisherCheck -AllowClobber
              shell: pwsh


            - name: Build .NET solution
              shell: pwsh
              run: |
                dotnet restore DomainDetective.sln

                $args = @(
                  "build",
                  "DomainDetective.sln",
                  "--configuration", "${{ env.BUILD_CONFIGURATION }}",    
                  "--no-restore"
                )

                dotnet @args 2>&1 | Tee-Object -Variable buildOutput
                $exitCode = $LASTEXITCODE

                if ($exitCode -ne 0) {
                  $text = $buildOutput -join "`n"
                  $isTransientCliLock = ($text -match "GenerateRuntimeConfigurationFiles" -or $text -match "CS2012") -and
                                        $text -match "DomainDetective\\.CLI" -and
                                        $text -match "being used by another process"

                  if ($isTransientCliLock) {
                    Write-Host "Detected transient DomainDetective.CLI file lock. Retrying with -m:1..."
                    Start-Sleep -Seconds 2
                    dotnet build DomainDetective.sln --configuration "${{ env.BUILD_CONFIGURATION }}" --no-restore -m:1
                    exit $LASTEXITCODE
                  }

                  exit $exitCode
                }
            - name: Run PowerShell tests
              run: ./Module/DomainDetective.Tests.ps1
              shell: pwsh

