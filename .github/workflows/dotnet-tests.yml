name: Test .NET

on:
  push:
    branches:
      - 'master'
      - 'main'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'Docs/**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: 'Release'
  TEST_VERBOSITY: minimal
  SUMMARIZE_FAILURES: true
  DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
  NET8_SOLUTION_FILTER: 'DomainDetective.Net8.slnf'

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            framework: net8.0
            run_cli_tests: true
          - os: windows-latest
            framework: net10.0
            run_cli_tests: true
          - os: windows-latest
            framework: net472
            run_cli_tests: false
          - os: ubuntu-latest
            framework: net8.0
            run_cli_tests: true
          - os: ubuntu-latest
            framework: net10.0
            run_cli_tests: true
          - os: macos-latest
            framework: net8.0
            run_cli_tests: true
          - os: macos-latest
            framework: net10.0
            run_cli_tests: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Verify .NET Framework 4.7.2 targeting pack
        if: matrix.framework == 'net472'
        shell: pwsh
        run: |
          $frameworkPath = "C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.7.2"
          if (-not (Test-Path $frameworkPath)) {
            Write-Error ".NET Framework 4.7.2 targeting pack not found. Install the developer pack on the runner."
            exit 1
          }
          Write-Host ".NET Framework 4.7.2 targeting pack available."

      - name: Restore dependencies (net8.0)
        if: matrix.framework == 'net8.0'
        run: dotnet restore ${{ env.NET8_SOLUTION_FILTER }}

      - name: Restore dependencies (net472)
        if: matrix.framework == 'net472'
        run: dotnet restore DomainDetective.sln

      - name: Restore dependencies (net10.0)
        if: matrix.framework == 'net10.0'
        run: dotnet restore DomainDetective.sln

      - name: Build solution (net8.0)
        if: matrix.framework == 'net8.0'
        shell: pwsh
        run: |
          $args = @(
            "build",
            "${{ env.NET8_SOLUTION_FILTER }}",
            "--configuration", "${{ env.BUILD_CONFIGURATION }}",
            "--framework", "${{ matrix.framework }}",
            "--no-restore",
            "-m:1",
            "-p:UseSharedCompilation=false"
          )

          dotnet @args 2>&1 | Tee-Object -Variable buildOutput
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            $text = $buildOutput -join "`n"
            $isTransientCliLock = ($text -match "GenerateRuntimeConfigurationFiles" -or $text -match "CS2012") -and
                                  $text -match "DomainDetective\\.CLI" -and
                                  $text -match "being used by another process"

            if ($isTransientCliLock) {
              Write-Host "Detected transient DomainDetective.CLI file lock. Retrying..."

              Get-Process -Name VBCSCompiler -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Remove-Item -Recurse -Force (Join-Path "DomainDetective.CLI" "obj") -ErrorAction SilentlyContinue
              Remove-Item -Recurse -Force (Join-Path "DomainDetective.CLI" "bin") -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 2
              dotnet build "${{ env.NET8_SOLUTION_FILTER }}" --configuration "${{ env.BUILD_CONFIGURATION }}" --framework "${{ matrix.framework }}" --no-restore -m:1 -p:UseSharedCompilation=false
              exit $LASTEXITCODE
            }

            exit $exitCode
          }

      - name: Build solution (net10.0)
        if: matrix.framework == 'net10.0'
        shell: pwsh
        run: |
          $args = @(
            "build",
            "DomainDetective.sln",
            "--configuration", "${{ env.BUILD_CONFIGURATION }}",
            "--framework", "${{ matrix.framework }}",
            "--no-restore",
            "-m:1",
            "-p:UseSharedCompilation=false"
          )

          dotnet @args 2>&1 | Tee-Object -Variable buildOutput
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            $text = $buildOutput -join "`n"
            $isTransientCliLock = ($text -match "GenerateRuntimeConfigurationFiles" -or $text -match "CS2012") -and
                                  $text -match "DomainDetective\\.CLI" -and
                                  $text -match "being used by another process"

            if ($isTransientCliLock) {
              Write-Host "Detected transient DomainDetective.CLI file lock. Retrying..."

              Get-Process -Name VBCSCompiler -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Remove-Item -Recurse -Force (Join-Path "DomainDetective.CLI" "obj") -ErrorAction SilentlyContinue
              Remove-Item -Recurse -Force (Join-Path "DomainDetective.CLI" "bin") -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 2
              dotnet build DomainDetective.sln --configuration "${{ env.BUILD_CONFIGURATION }}" --framework "${{ matrix.framework }}" --no-restore -m:1 -p:UseSharedCompilation=false
              exit $LASTEXITCODE
            }

            exit $exitCode
          }

      - name: Build tests (net472)
        if: matrix.framework == 'net472'
        run: dotnet build DomainDetective.Tests/DomainDetective.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net472 --no-restore

      - name: Run tests (DomainDetective.Tests) (net472)
        if: matrix.framework == 'net472'
        run: dotnet test DomainDetective.Tests/DomainDetective.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework ${{ matrix.framework }} --no-build --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --filter "FullyQualifiedName!~DomainDetective.Tests.TestDnssecRecordValidation"

      - name: Run tests (DomainDetective.Tests) (modern .NET)
        if: matrix.framework != 'net472'
        run: dotnet test DomainDetective.Tests/DomainDetective.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework ${{ matrix.framework }} --no-build --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --collect:"XPlat Code Coverage"

      - name: Run tests (DomainDetective.CLI.Tests)
        if: matrix.run_cli_tests == true
        run: dotnet test DomainDetective.CLI.Tests/DomainDetective.CLI.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework ${{ matrix.framework }} --no-build --verbosity ${{ env.TEST_VERBOSITY }} --logger "console;verbosity=${{ env.TEST_VERBOSITY }}" --logger trx --collect:"XPlat Code Coverage"

      - name: Summarize failing tests
        if: failure() && env.SUMMARIZE_FAILURES == 'true'
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Recurse -Filter *.trx
          if ($trxFiles.Count -eq 0) {
            Write-Host "No TRX files found for failure analysis"
            exit 0
          }

          Write-Host "=== Failed Tests Summary ==="
          $failureCount = 0

          $trxFiles | ForEach-Object {
            try {
              Select-Xml -Path $_.FullName -XPath "//UnitTestResult[@outcome='Failed']" |
                ForEach-Object {
                  $name = $_.Node.testName
                  $msg = $_.Node.Output.ErrorInfo.Message ?? "No error message available"
                  Write-Host "❌ $name"
                  Write-Host "   $msg"
                  $failureCount++
                }
            } catch {
              Write-Host "Warning: Could not parse TRX file $($_.Name): $($_.Exception.Message)"
            }
          }

          if ($failureCount -eq 0) {
            Write-Host "No failed tests found in TRX files"
          } else {
            Write-Host "=== Total failed tests: $failureCount ==="
          }

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.framework }}
          path: '**/*.trx'

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports-${{ matrix.os }}-${{ matrix.framework }}
          path: '**/coverage.cobertura.xml'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        continue-on-error: true
        with:
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false
