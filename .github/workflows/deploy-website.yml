name: Deploy Website

on:
  push:
    branches: [master]
    paths:
      - "Website/**"
      - "DomainDetective.Website/**"
      - "DomainDetective.Toolbox/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

jobs:
  website-deploy:
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-deploy.yml@d82db5edf64b9dab199917e2b300902e2d14d7c0
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      site_output_path: Website/_site
      runner_labels_json: ${{ github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      powerforge_ref: 49b2f74ee8badf1c1d19848fd36420caff29f0d2
      powerforge_web_tag: PowerForgeWeb-v1.0.0-preview-202603311925
    secrets:
      indexnow_key: ${{ secrets.INDEXNOW_KEY }}
