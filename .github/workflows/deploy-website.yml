name: Deploy Website

on:
  push:
    branches: [master]
    paths:
      - "Website/**"
      - "DomainDetective.Website/**"
      - "DomainDetective.Toolbox/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

jobs:
  website-deploy:
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-deploy.yml@3ccf923345c9f511325f8db54fa36a8d733995c2
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      site_output_path: Website/_site
      engine_mode: source
      runner_labels_json: ${{ github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      powerforge_ref: 3ccf923345c9f511325f8db54fa36a8d733995c2
      powerforge_web_tag: PowerForgeWeb-v1.0.0-preview-202603311925
    secrets:
      indexnow_key: ${{ secrets.INDEXNOW_KEY }}
