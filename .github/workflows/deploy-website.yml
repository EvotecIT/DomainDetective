name: Deploy Website

on:
  push:
    branches: [master]
    paths:
      - "Website/**"
      - "DomainDetective.Website/**"
      - "DomainDetective.Toolbox/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

jobs:
  website-deploy:
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-deploy.yml@15192638c1c7d2f6907cd6c8b586017a0f4ec4a8
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      site_output_path: Website/_site
      runner_labels_json: ${{ github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      powerforge_ref: 15192638c1c7d2f6907cd6c8b586017a0f4ec4a8
      powerforge_web_tag: PowerForgeWeb-v1.0.0-preview-202603301051
    secrets:
      indexnow_key: ${{ secrets.INDEXNOW_KEY }}
