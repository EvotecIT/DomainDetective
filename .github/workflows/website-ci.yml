name: Website Build (PR)

on:
  pull_request:
    paths:
      - "Website/**"
      - "DomainDetective.Website/**"
      - "DomainDetective.Toolbox/**"
      - "DomainDetective.Website.Tests/**"
      - ".github/scripts/Test-WebsiteDeployContract.ps1"
      - ".github/workflows/deploy-website.yml"
      - ".github/workflows/website-ci.yml"
  workflow_dispatch:

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  BUILD_CONFIGURATION: 'Release'

jobs:
  website-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Run website regression tests
        run: dotnet test DomainDetective.Website.Tests/DomainDetective.Website.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --framework net10.0 --verbosity minimal --logger "console;verbosity=minimal" --logger trx --collect:"XPlat Code Coverage"

  deploy-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deploy contract
        shell: pwsh
        run: ./.github/scripts/Test-WebsiteDeployContract.ps1 -DeployWorkflowPath .github/workflows/deploy-website.yml -PipelinePath Website/pipeline.json

  website-build:
    needs:
      - website-tests
      - deploy-contract
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-ci.yml@dd88fcac5f50143a774cbe47a6705a83d400bfe1
    with:
      website_root: Website
      pipeline_config: Website/pipeline.json
      engine_mode: source
      runner_labels_json: ${{ github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      powerforge_repository: EvotecIT/PSPublishModule
      powerforge_ref: dd88fcac5f50143a774cbe47a6705a83d400bfe1
      powerforge_web_tag: PowerForgeWeb-v1.0.0-preview-202604140746
      report_artifact_name: powerforge-website-reports
