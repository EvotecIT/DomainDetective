name: Website Maintenance

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: website-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  website-maintenance:
    uses: EvotecIT/PSPublishModule/.github/workflows/powerforge-website-maintenance.yml@3ccf923345c9f511325f8db54fa36a8d733995c2
    with:
      website_root: Website
      pipeline_config: Website/pipeline.maintenance.json
      engine_mode: source
      runner_labels_json: ${{ github.event.repository.private && '["self-hosted","linux"]' || '["ubuntu-latest"]' }}
      powerforge_ref: 3ccf923345c9f511325f8db54fa36a8d733995c2
      powerforge_web_tag: PowerForgeWeb-v1.0.0-preview-202603301051
      report_artifact_name: powerforge-website-maintenance-reports
