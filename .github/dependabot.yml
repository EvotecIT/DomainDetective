version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    ignore:
      - dependency-name: SixLabors.ImageSharp
        update-types:
          - version-update:semver-major
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      include:
        - '*'
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      include:
        - '*'
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - '*'
