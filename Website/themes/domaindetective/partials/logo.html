{{~ ## DomainDetective mark: a lens over a verified check, traced in the cyan -> lime signal gradient.
     Set mark_id before including so header and footer copies keep unique gradient ids. ## ~}}
{{~ if !mark_id; mark_id = "ddm"; end ~}}
<svg class="dd-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false"><defs><linearGradient id="{{ mark_id }}" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3be3f5"/><stop offset=".55" stop-color="#8cf5b5"/><stop offset="1" stop-color="#d9f76a"/></linearGradient></defs><rect x=".75" y=".75" width="30.5" height="30.5" rx="8.5" fill="#06141a" stroke="url(#{{ mark_id }})" stroke-opacity=".5" stroke-width="1.5"/><circle cx="14.2" cy="14.2" r="7.2" fill="none" stroke="url(#{{ mark_id }})" stroke-width="2.4"/><path d="M19.6 19.6 24.6 24.6" stroke="url(#{{ mark_id }})" stroke-width="3" stroke-linecap="round"/><path d="M10.9 14.4l2.2 2.2 4.2-4.4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
