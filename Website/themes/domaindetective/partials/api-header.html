<script>
(function () {
  function readTheme() {
    try {
      return localStorage.getItem('dd-theme') === 'light' ? 'light' : 'dark';
    } catch (error) {
      return 'dark';
    }
  }

  function applyTheme(theme) {
    var nextTheme = theme === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nextTheme);
    document.documentElement.style.colorScheme = nextTheme;
    return nextTheme;
  }

  function normalizePath(path) {
    var normalized = path || '/';
    if (normalized.charAt(0) !== '/') {
      normalized = '/' + normalized;
    }
    if (!normalized.endsWith('/')) {
      normalized += '/';
    }
    return normalized;
  }

  function isActivePath(currentPath, targetPath) {
    if (!targetPath) {
      return false;
    }

    if (targetPath === '/') {
      return currentPath === '/';
    }

    return currentPath === targetPath || currentPath.indexOf(targetPath) === 0;
  }

  function closeDropdown(dropdown) {
    var trigger = dropdown.querySelector('.dd-nav-dropdown-trigger, .nav-dropdown-trigger, .nav-dropdown-trigger-button');
    dropdown.classList.remove('open');
    if (trigger) {
      trigger.setAttribute('aria-expanded', 'false');
    }
  }

  function wireHeader() {
    var currentPath = normalizePath(window.location.pathname || '/');
    var nav = document.querySelector('.dd-nav');
    var navToggle = document.querySelector('.dd-nav-toggle');

    document.querySelectorAll('.dd-nav-links > a').forEach(function (link) {
      link.classList.add('dd-nav-link');

      var href = link.getAttribute('href');
      if (href && isActivePath(currentPath, normalizePath(href))) {
        link.classList.add('is-active');
        link.setAttribute('aria-current', 'page');
      }
    });

    document.querySelectorAll('.dd-nav .nav-dropdown').forEach(function (dropdown) {
      dropdown.classList.add('dd-nav-dropdown');

      var trigger = dropdown.querySelector('.nav-dropdown-trigger, .nav-dropdown-trigger-button, .dd-nav-dropdown-trigger');
      if (!trigger) {
        return;
      }

      trigger.classList.add('dd-nav-dropdown-trigger');
      trigger.setAttribute('aria-haspopup', 'true');

      var childActive = false;
      dropdown.querySelectorAll('.nav-dropdown-menu a').forEach(function (link) {
        var href = link.getAttribute('href');
        if (href && isActivePath(currentPath, normalizePath(href))) {
          link.classList.add('active');
          childActive = true;
        }
      });

      if (childActive || currentPath.indexOf('/api/') === 0) {
        dropdown.classList.add('open');
        trigger.classList.add('is-active');
        trigger.setAttribute('aria-expanded', 'true');
      } else {
        trigger.setAttribute('aria-expanded', 'false');
      }
    });

    if (navToggle && nav && navToggle.dataset.navBound !== 'true') {
      navToggle.dataset.navBound = 'true';
      navToggle.addEventListener('click', function () {
        var isOpen = nav.classList.toggle('open');
        navToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        document.body.classList.toggle('nav-open', isOpen);
      });
    }

    var navDropdowns = document.querySelectorAll('.dd-nav-dropdown, .nav-dropdown');
    if (navDropdowns.length > 0) {
      navDropdowns.forEach(function (dropdown) {
        var trigger = dropdown.querySelector('.dd-nav-dropdown-trigger, .nav-dropdown-trigger, .nav-dropdown-trigger-button');
        if (!trigger || trigger.dataset.dropdownBound === 'true') {
          return;
        }

        trigger.dataset.dropdownBound = 'true';
        trigger.addEventListener('click', function (event) {
          if (trigger.tagName === 'BUTTON') {
            event.preventDefault();
          }

          var willOpen = !dropdown.classList.contains('open');
          navDropdowns.forEach(function (candidate) {
            if (candidate !== dropdown) {
              closeDropdown(candidate);
            }
          });

          dropdown.classList.toggle('open', willOpen);
          trigger.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
        });
      });

      document.addEventListener('click', function (event) {
        navDropdowns.forEach(function (dropdown) {
          if (!dropdown.contains(event.target)) {
            closeDropdown(dropdown);
          }
        });
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          navDropdowns.forEach(function (dropdown) {
            closeDropdown(dropdown);
          });
        }
      });
    }
  }

  var initialTheme = applyTheme(readTheme());

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('.theme-cycle-btn').forEach(function (button) {
      if (button.dataset.themeBound === 'true') {
        return;
      }

      button.dataset.themeBound = 'true';
      button.addEventListener('click', function () {
        var currentTheme = document.documentElement.getAttribute('data-theme') || initialTheme || 'dark';
        var nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
        applyTheme(nextTheme);

        try {
          localStorage.setItem('dd-theme', nextTheme);
        } catch (error) {
          /* Ignore storage failures. */
        }
      });
    });

    wireHeader();
  });
})();
</script>
<header class="dd-header">
  <div class="dd-header-inner">
    <a href="/" class="dd-brand">
      <svg class="dd-logo" viewBox="0 0 32 32" width="28" height="28" fill="none" aria-hidden="true" focusable="false">
        <circle cx="16" cy="16" r="14" stroke="var(--pf-accent)" stroke-width="2" fill="none"/>
        <path d="M10 16l4 4 8-8" stroke="var(--pf-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span>Domain Detective</span>
    </a>
    <button class="dd-nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <nav class="dd-nav" aria-label="Main navigation">
      <!-- PowerForge API docs replaces these placeholders with the configured primary menu and header actions. -->
      <div class="dd-nav-links">{{NAV_LINKS}}</div>
      <div class="dd-nav-actions">{{NAV_ACTIONS}}</div>
    </nav>
  </div>
</header>
